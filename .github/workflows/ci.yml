
name: MedOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Django Tests - PostgreSQL
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: medops
          POSTGRES_USER: medops
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medops -d medops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-django-secret-not-for-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      POSTGRES_DB: medops
      POSTGRES_USER: medops
      POSTGRES_PASSWORD: ci-test-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check appointments/ config/ manage.py

      - name: Ruff format check
        run: ruff format --check appointments/ config/ manage.py

      - name: Check Django configuration
        run: python manage.py check

      - name: Verify migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: |
          coverage run manage.py test appointments -v 2
          coverage report -m --fail-under=90
          coverage xml -o coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: medops-coverage
          path: coverage.xml
          if-no-files-found: error

  docker:
    name: Docker Image Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t medops:ci .

  prometheus:
    name: Prometheus Alert Rules
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Prometheus alert rules
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.15.1 \
            check rules /etc/prometheus/alert-rules.yml

      - name: Test Prometheus alert conditions
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.15.1 \
            test rules /etc/prometheus/alert-rules.test.yml


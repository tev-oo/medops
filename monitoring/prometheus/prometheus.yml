global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: medops-node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: medops-postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: medops-django
    metrics_path: /metrics

    authorization:
      type: Bearer
      credentials_file: /run/secrets/medops_metrics_token

    static_configs:
      - targets:
          - web:8000

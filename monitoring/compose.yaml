services:
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped

    environment:
      DATA_SOURCE_URI: "db:5432/postgres?sslmode=disable"
      DATA_SOURCE_USER: "medops_monitor"
      DATA_SOURCE_PASS_FILE: "/run/secrets/pg_monitor_password"

    volumes:
      - /opt/medops-secrets/pg_monitor_password:/run/secrets/pg_monitor_password:ro

    networks:
      - default
      - medops-app

    mem_limit: 128m
  
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    mem_limit: 512m

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    restart: unless-stopped

    command:
      - --path.rootfs=/host

    pid: host

    volumes:
      - /:/host:ro,rslave

    mem_limit: 128m
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro

    mem_limit: 768m

    depends_on:
      - prometheus
volumes:
  prometheus_data:
  grafana_data:

networks:
  medops-app:
    external: true
    name: medops_default

global:
  resolve_timeout: 5m

  smtp_smarthost: smtp.gmail.com:587
  smtp_from: tevinajode@gmail.com
  smtp_auth_username: tevinajode@gmail.com
  smtp_auth_password_file: /run/secrets/gmail_app_password
  smtp_require_tls: true

route:
  receiver: medops-email
  group_by:
    - alertname
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: medops-email
    email_configs:
      - to: tevinajode@gmail.com
        send_resolved: true
        headers:
          Subject: '[MedOps] {{ .Status | toUpper }} - {{ .CommonLabels.alertname }}'
